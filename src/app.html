<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="FM.PHOTO — a high-energy photobooth gallery platform for nightlife events." />
		<meta name="theme-color" content="#0a0810" />
		<link rel="icon" href="https://booth-flash-gallery.lovable.app/favicon.ico" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<script>
			try {
				const storedTheme = localStorage.getItem('admin-theme');
				if (storedTheme === 'light') {
					document.documentElement.classList.add('light');
				} else if (storedTheme === 'dark') {
					document.documentElement.classList.remove('light');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
